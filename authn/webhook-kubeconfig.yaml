# apiserver -> webhook connection settings ("inverted" kubeconfig:
# clusters = the webhook server, users = the apiserver itself).
apiVersion: v1
kind: Config
clusters:
  - name: poc-authn-webhook
    cluster:
      server: https://127.0.0.1:8443/authenticate
      certificate-authority: /etc/kubernetes/webhook/ca.crt
users:
  - name: kube-apiserver
    user: {}                     # phase 1: webhook requires no client auth
contexts:
  - name: poc-authn-webhook
    context:
      cluster: poc-authn-webhook
      user: kube-apiserver
current-context: poc-authn-webhook
