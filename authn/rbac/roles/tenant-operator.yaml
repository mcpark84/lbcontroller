# role tenant-operator -> group mk8s:tenant-operator -> built-in 'view' in each customer namespace only.
# Control-plane namespaces (kube-system, gpu-operator, ...) have no binding -> 403.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mk8s-tenant-operator
  namespace: default
  labels: {app.kubernetes.io/part-of: poc-authn, mk8s.skt.com/role: tenant-operator}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "mk8s:tenant-operator"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mk8s-tenant-operator
  namespace: dynamo-system
  labels: {app.kubernetes.io/part-of: poc-authn, mk8s.skt.com/role: tenant-operator}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "mk8s:tenant-operator"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mk8s-tenant-operator
  namespace: inferium
  labels: {app.kubernetes.io/part-of: poc-authn, mk8s.skt.com/role: tenant-operator}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "mk8s:tenant-operator"}
