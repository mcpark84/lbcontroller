# role skt-admin -> group mk8s:skt-admin -> built-in cluster-admin (whole cluster incl. control-plane namespaces)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mk8s-skt-admin
  labels: {app.kubernetes.io/part-of: poc-authn, mk8s.skt.com/role: skt-admin}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "mk8s:skt-admin"}
