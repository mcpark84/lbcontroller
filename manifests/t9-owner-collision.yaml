# T9 — txt-owner-id 충돌 재현 (★ 의도적 오설정 — 운영 사고 재현용)
#  변경점(기준: manifests/external-dns.yaml):
#   1) tenant-b 의 --txt-owner-id 를 tenant-a 와 동일한 "tenant-a-cluster" 로 (충돌)
#   2) 양쪽 --domain-filter 를 상위 도메인 poc.internal 로 확장
#   3) 양쪽 --rfc2136-zone 에 두 존 모두 지정 (BIND 에 poc.internal 상위 존이 없으므로 존 단위로 열거)
#   --namespace 제한은 유지 (테넌트당 클러스터 모사; tenant-b 는 tenant-a 의 Ingress 를 못 봄)
#  기대: tenant-b 의 sync 루프가 "내 owner-id 인데 내 소스에 없는" web.tenant-a 레코드를 삭제 → tenant-a 가 재생성 → 반복(flapping)
#  적용:  kubectl apply -f manifests/t9-owner-collision.yaml
#  복구:  kubectl apply -f manifests/external-dns.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-tenant-a
  namespace: poc-edns
  labels: { app: external-dns, tenant: tenant-a }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: external-dns, tenant: tenant-a }
  template:
    metadata:
      labels: { app: external-dns, tenant: tenant-a }
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: mgmt01:5000/poc/external-dns:v0.15.1
          env:
            - name: TSIG_SECRET
              valueFrom: { secretKeyRef: { name: externaldns-tsig, key: tsig-secret } }
          args:
            - --source=service
            - --source=ingress
            - --namespace=tenant-a
            - --provider=rfc2136
            - --rfc2136-host=bind9.poc-dns.svc.cluster.local
            - --rfc2136-port=53
            - --rfc2136-zone=tenant-a.poc.internal
            - --rfc2136-zone=tenant-b.poc.internal       # T9: 두 존
            - --rfc2136-tsig-keyname=externaldns
            - --rfc2136-tsig-secret=$(TSIG_SECRET)
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-tsig-axfr
            - --rfc2136-min-ttl=60s
            - --domain-filter=poc.internal               # T9: 상위 도메인으로 확장
            - --txt-owner-id=tenant-a-cluster
            - --registry=txt
            - --policy=sync
            - --interval=1m
            - --log-level=debug
            - --events
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-tenant-b
  namespace: poc-edns
  labels: { app: external-dns, tenant: tenant-b }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: external-dns, tenant: tenant-b }
  template:
    metadata:
      labels: { app: external-dns, tenant: tenant-b }
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: mgmt01:5000/poc/external-dns:v0.15.1
          env:
            - name: TSIG_SECRET
              valueFrom: { secretKeyRef: { name: externaldns-tsig, key: tsig-secret } }
          args:
            - --source=service
            - --source=ingress
            - --namespace=tenant-b
            - --provider=rfc2136
            - --rfc2136-host=bind9.poc-dns.svc.cluster.local
            - --rfc2136-port=53
            - --rfc2136-zone=tenant-a.poc.internal       # T9: 두 존
            - --rfc2136-zone=tenant-b.poc.internal
            - --rfc2136-tsig-keyname=externaldns
            - --rfc2136-tsig-secret=$(TSIG_SECRET)
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-tsig-axfr
            - --rfc2136-min-ttl=60s
            - --domain-filter=poc.internal               # T9: 상위 도메인으로 확장
            - --txt-owner-id=tenant-a-cluster            # ★★ 의도적 충돌 (원래 tenant-b-cluster)
            - --registry=txt
            - --policy=sync
            - --interval=1m
            - --log-level=debug
            - --events
