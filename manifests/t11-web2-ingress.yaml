# T11 — write-back 누락 무증상 실패 재현용 신규 Ingress (mock 중지 상태에서 생성)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web2
  namespace: tenant-a
spec:
  ingressClassName: neocloud
  rules:
    - host: web2.tenant-a.poc.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 80 }
