# T2 — ExternalDNS (rfc2136 → BIND9). 테넌트당 1 인스턴스 (운영의 "테넌트당 클러스터" 를 한 클러스터에서 모사)
# 사전조건: scripts/t2-copy-tsig-secret.sh 로 poc-dns/externaldns-tsig 를 poc-edns 로 복사
# 적용:  kubectl apply -f manifests/external-dns.yaml
# 확인:  kubectl -n poc-edns logs deploy/external-dns-tenant-a | grep -iE "axfr|error"
---
apiVersion: v1
kind: Namespace
metadata:
  name: poc-edns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: poc-edns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: poc-external-dns
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: poc-external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: poc-external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: poc-edns
---
# ───────────── tenant-a ─────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-tenant-a
  namespace: poc-edns
  labels: { app: external-dns, tenant: tenant-a }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: external-dns, tenant: tenant-a }
  template:
    metadata:
      labels: { app: external-dns, tenant: tenant-a }
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: mgmt01:5000/poc/external-dns:v0.15.1
          env:
            - name: TSIG_SECRET
              valueFrom: { secretKeyRef: { name: externaldns-tsig, key: tsig-secret } }
          args:
            - --source=service
            - --source=ingress
            - --namespace=tenant-a                       # ★ T8 보정: 운영의 "테넌트당 클러스터" 모사 — 자기 테넌트 ns 만 감시
            - --provider=rfc2136
            - --rfc2136-host=bind9.poc-dns.svc.cluster.local
            - --rfc2136-port=53
            - --rfc2136-zone=tenant-a.poc.internal
            - --rfc2136-tsig-keyname=externaldns
            - --rfc2136-tsig-secret=$(TSIG_SECRET)
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-tsig-axfr
            - --rfc2136-min-ttl=60s
            - --domain-filter=tenant-a.poc.internal      # ★ T8
            - --txt-owner-id=tenant-a-cluster            # ★ T9
            - --registry=txt
            - --policy=sync                              # ★ T10
            - --interval=1m
            - --log-level=debug
            - --events
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
---
# ───────────── tenant-b ─────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-tenant-b
  namespace: poc-edns
  labels: { app: external-dns, tenant: tenant-b }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: external-dns, tenant: tenant-b }
  template:
    metadata:
      labels: { app: external-dns, tenant: tenant-b }
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: mgmt01:5000/poc/external-dns:v0.15.1
          env:
            - name: TSIG_SECRET
              valueFrom: { secretKeyRef: { name: externaldns-tsig, key: tsig-secret } }
          args:
            - --source=service
            - --source=ingress
            - --namespace=tenant-b                       # ★ T8 보정
            - --provider=rfc2136
            - --rfc2136-host=bind9.poc-dns.svc.cluster.local
            - --rfc2136-port=53
            - --rfc2136-zone=tenant-b.poc.internal
            - --rfc2136-tsig-keyname=externaldns
            - --rfc2136-tsig-secret=$(TSIG_SECRET)
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-tsig-axfr
            - --rfc2136-min-ttl=60s
            - --domain-filter=tenant-b.poc.internal
            - --txt-owner-id=tenant-b-cluster
            - --registry=txt
            - --policy=sync
            - --interval=1m
            - --log-level=debug
            - --events
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
